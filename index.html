<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Garnish Bar | Atelier & Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'garnish-green': '#003d33',
              'garnish-gold': '#c5a059',
              'garnish-beige': '#f0ece2',
              'garnish-dark': '#1a1a1a',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              script: ['"Great Vibes"', 'cursive'],
              sans: ['"Lato"', 'sans-serif'],
              cinzel: ['"Cinzel"', 'serif'],
            },
            backgroundImage: {
              'crackle-pattern': "url('https://www.transparenttextures.com/patterns/cracked-concrete.png')",
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for all browsers */
      html {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE and Edge */
      }
      
      html::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
      }

      .text-shadow-gold {
        text-shadow: 1px 1px 2px rgba(197, 160, 89, 0.3);
      }
      .drop-shadow-text {
         text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-garnish-beige text-garnish-dark antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
